<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waterbodem tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --blue: #385193;
        --ink: #111930;
        --muted: #6a7184;
        --line: rgba(56, 81, 147, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        scrollbar-width: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
      }

      body {
        display: grid;
        min-height: 100%;
        margin: 0;
        color: var(--ink);
        font-family: Poppins, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        place-items: center;
      }

      main {
        display: grid;
        gap: 18px;
        justify-items: center;
        width: min(100% - 44px, 380px);
        padding: 0;
        text-align: center;
        background: transparent;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .icon {
        display: grid;
        width: 62px;
        height: 62px;
        color: #ffffff;
        background: var(--blue);
        border-radius: 50%;
        box-shadow: 0 18px 34px rgba(56, 81, 147, 0.22);
        place-items: center;
      }

      .icon svg {
        width: 28px;
        height: 28px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.4;
      }

      h1 {
        max-width: 16ch;
        margin: 0;
        font-family: Poppins, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: clamp(1.6rem, 5vw, 2.1rem);
        font-weight: 300;
        line-height: 1.06;
        letter-spacing: -0.035em;
      }

      p {
        max-width: 29ch;
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 650;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 5v10" />
          <path d="M8 9l4-4 4 4" />
          <path d="M5 17v1.5A1.5 1.5 0 0 0 6.5 20h13a1.5 1.5 0 0 0 1.5-1.5V17" />
        </svg>
      </div>
      <h1>Upload je waterbodemonderzoek</h1>
      <p>Hier komt de interactieve analyse-tool. De iframe staat klaar voor de definitieve widget.</p>
    </main>
  </body>
</html>
